name: Deploy to GitHub Pages and Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Obligatoire pour pouvoir pousser l'historique Git vers Hugging Face
          fetch-depth: 0 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      # =========================================================================
      # NOUVELLE ÉTAPE : Synchronisation automatique vers Hugging Face Spaces
      # =========================================================================
      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Remplacez 'votre-pseudo' et 'nom-de-votre-space' par vos identifiants Hugging Face
          git remote add hf https://onlinedefend9:$HF_TOKEN@huggingface.co/spaces/onlinedefend9/nom-de-votre-space
          
          # Envoi forcé de votre code vers le Space Hugging Face
          git push --force hf main
